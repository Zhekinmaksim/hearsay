<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hearsay">
  <title>Hearsay</title>
  <desc>A gate drawn as a vertical rule. One claim crosses it; the other stops short.</desc>
  <!--
    The whole project in one glyph. The upright is the gate. Two claims arrive
    from the left: the upper one is carried by its source and passes through,
    the lower one is not and stops where it was turned away. The gap is the
    point, so it is wide enough to survive a 16px favicon.
  -->
  <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="butt">
    <path d="M6 23 H58"/>
    <path d="M6 43 H29"/>
    <path d="M39 8 V56"/>
  </g>
</svg>
